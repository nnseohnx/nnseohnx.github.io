<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seohyeon's Space</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0a0a0a; color: #f0f0f0; font-family: 'Pretendard', sans-serif; overflow-x: hidden; }
        
        /* 메인 비디오 섹션 */
        .hero { height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; }
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0.4; }
        .content { z-index: 1; text-align: center; }

        /* 에셋 배치 */
        .asset-box { margin-top: 20px; display: flex; gap: 20px; justify-content: center; }
        img { width: 300px; border-radius: 15px; border: 1px solid #333; transition: 0.3s; }
        img:hover { transform: scale(1.05); border-color: #fff; }
        
        h1 { font-size: 3rem; margin-bottom: 10px; }
    </style>
</head>
<body>
    <section class="hero">
        <video autoplay muted loop playsinline>
            <source src="assets/Main.mp4" type="video/mp4">
        </video>
        <div class="content">
            <h1>Nam Seohyeon</h1>
            <p>Welcome to my dark aesthetic portfolio</p>
            <div class="asset-box">
                <img src="assets/hello.png" alt="Hello">
                <img src="assets/main.png" alt="Main">
            </div>
        </div>
    </section>
</body>
</html>
