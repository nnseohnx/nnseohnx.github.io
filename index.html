<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>NNSEOHNX | Dark Portfolio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <style>
        body { margin: 0; background: #050505; color: #fff; font-family: 'Pretendard', sans-serif; }
        
        /* 메인 비디오 섹션 (에셋 활용) */
        .hero { height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0.3; }
        .content { z-index: 1; text-align: center; }
        
        /* 갤러리 섹션 (에셋 활용) */
        .gallery { padding: 100px; display: flex; justify-content: center; gap: 30px; }
        .gallery img { width: 300px; border: 1px solid #333; transition: 0.5s; }
        .gallery img:hover { transform: scale(1.05); border-color: #fff; }

        /* 3D 영역 */
        #skyline-container { width: 100%; height: 500px; background: #050505; }
    </style>
</head>
<body>
    <section class="hero">
        <video autoplay muted loop playsinline>
            <source src="assets/Main.mp4" type="video/mp4">
        </video>
        <div class="content">
            <h1>NNSEOHNX</h1>
            <p>Artificial Intelligence Major</p>
        </div>
    </section>

    <section class="gallery">
        <img src="assets/hello.png" alt="Hello">
        <img src="assets/main.png" alt="Main">
    </section>

    <div id="skyline-container"></div>

    <script>
        // Three.js 기본 설정
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/500, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, 500);
        document.getElementById('skyline-container').appendChild(renderer.domElement);

        // 조명 추가 (블랙 톤과 어울리는 차가운 화이트)
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(1, 1, 1);
        scene.add(light);
        camera.position.z = 5;

        // 여기에 깃허브에서 받은 skyline.obj 파일을 로드합니다.
        const loader = new THREE.OBJLoader();
        loader.load('assets/skyline.obj', (obj) => {
            scene.add(obj);
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
